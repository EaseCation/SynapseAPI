[versions]
kotlin = "2.2.20"
hutool = "5.8.40"
jackson = "2.20.0"
netty = "4.1.127.Final"
log4j = "2.25.2"
mockito = "5.20.0"
jline = "3.30.6"
maven = "1.9.24"

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-lombok = { id = "org.jetbrains.kotlin.plugin.lombok", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version = "9.2.2" }
git = { id = "com.gorylenko.gradle-git-properties", version = "2.5.3" }
versions = { id = "com.github.ben-manes.versions", version = "0.53.0" }
foojayResolver = { id = "org.gradle.toolchains.foojay-resolver", version = "1.0.0" }

[libraries]
avro4k = { module = "com.github.avro-kotlin.avro4k:avro4k-core", version = "2.6.0" }
aliyun-log = { module = "com.aliyun.openservices:aliyun-log", version = "0.6.139" }
aliyun-oss = { module = "com.aliyun.oss:aliyun-sdk-oss", version = "3.18.3" }
apache-ant = { module = "org.apache.ant:ant", version = "1.10.15" }
apache-commons-compress = { module = "org.apache.commons:commons-compress", version = "1.28.0" }
apache-commons-lang3 = { module = "org.apache.commons:commons-lang3", version = "3.19.0" }
apache-commons-text = { module = "org.apache.commons:commons-text", version = "1.14.0" }
bouncycastle-jdk18 = { module = "org.bouncycastle:bcprov-jdk18on", version = "1.82" }
bucket4j = { module = "com.bucket4j:bucket4j_jdk17-core", version = "8.15.0" }
c3p0 = { module = "com.mchange:c3p0", version = "0.11.2" }
commons-io = { module = "commons-io:commons-io", version = "2.20.0" }
expiringmap = { module = "net.jodah:expiringmap", version = "0.5.11" }
fastutil = { module = "it.unimi.dsi:fastutil", version = "8.5.18" }
gson = { module = "com.google.code.gson:gson", version = "2.13.2" }
guava = { module = "com.google.guava:guava", version = "33.5.0-jre" }
hutool-cache = { module = "cn.hutool:hutool-cache", version.ref = "hutool" }
hutool-core = { module = "cn.hutool:hutool-core", version.ref = "hutool" }
hutool-json = { module = "cn.hutool:hutool-json", version.ref = "hutool" }
influxdb-client = { module = "com.influxdb:influxdb-client-java", version = "7.3.0" }
jackson = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-guava = { module = "com.fasterxml.jackson.datatype:jackson-datatype-guava", version.ref = "jackson" }
jackson-datatype-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8", version.ref = "jackson" }
javax-annotations = { module = "com.google.code.findbugs:jsr305", version = "3.0.2" }
jedis = { module = "redis.clients:jedis", version = "4.4.8" } # 我们目前使用 redis 5.0.3, 只能用 jedis 4.x
jline-reader = { module = "org.jline:jline-reader", version.ref = "jline" }
jline-terminal = { module = "org.jline:jline-terminal-jni", version.ref = "jline" }
jline-terminal-ffm = { module = "org.jline:jline-terminal-ffm", version.ref = "jline" }
jopt = { module = "net.sf.jopt-simple:jopt-simple", version = "5.0.4" }
jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version = "6.0.0" }
jwt = { module = "com.nimbusds:nimbus-jose-jwt", version = "10.5" }
kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.10.2" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-serialization-json  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.9.0" }
jetbrains-annotation = { module = "org.jetbrains:annotations", version = "26.0.2" }
larksuite-sdk = { module = "com.larksuite.oapi:oapi-sdk", version = "2.4.24" }
leveldb-mcpe-jni = { module = "net.daporkchop:leveldb-mcpe-jni", version = "0.0.10-SNAPSHOT" }
leveldb-natives = { module = "net.daporkchop.lib:natives", version = "0.5.8-SNAPSHOT" }
lmax-disruptor = { module = "com.lmax:disruptor", version = "4.0.0" }
lmbda = { group = "org.lanternpowered", name = "lmbda", version = "2.0.0" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j2 = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
lombok = { module = "org.projectlombok:lombok", version = "1.18.42" }
maven-provider = { group = "org.apache.maven", name = "maven-resolver-provider", version = "3.9.11" }
maven-connector = { group = "org.apache.maven.resolver", name = "maven-resolver-connector-basic", version.ref = "maven" }
maven-http = { group = "org.apache.maven.resolver", name = "maven-resolver-transport-http", version.ref = "maven" }
maxmind-geoip2 = { module = "com.maxmind.geoip2:geoip2", version = "4.4.0" }
minecrell-console = { module = "net.minecrell:terminalconsoleappender", version = "1.3.0" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version = "8.4.0" } # 9.x 会与 aliyun-log 的 protobuf 冲突, 暂时只能用 8.x
neteasepe-nukkit = { module = "com.github.NetEasePE:Nukkit", version = "r21_u0-SNAPSHOT" }
netty-all = { module = "io.netty:netty-all", version.ref = "netty" }
netty-buffer = { module = "io.netty:netty-buffer", version.ref = "netty" }
netty-epoll = { module = "io.netty:netty-transport-native-epoll", version.ref = "netty" }
netty-handler = { module = "io.netty:netty-handler", version.ref = "netty" }
netty-http = { module = "io.netty:netty-codec-http", version.ref = "netty" }
netty-kqueue = { module = "io.netty:netty-transport-native-kqueue", version.ref = "netty" }
nukkitx-natives = { module = "com.nukkitx:natives", version = "1.0.3" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.1.0" }
org-cloudburstmc-upnp = { module = "org.cloudburstmc:upnp", version = "1.1.1" }
org-msgpack-msgpack-core = { module = "org.msgpack:jackson-dataformat-msgpack", version = "0.9.10" }
otp = { module = "com.eatthepath:java-otp", version = "0.4.0" }
slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.17" }
klibnotion = { module = "org.jraf:klibnotion-jvm", version = "1.12.0" }
snakeyaml = { module = "org.yaml:snakeyaml", version = "2.5" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version = "2.10" }
snappy = { module = "org.xerial.snappy:snappy-java", version = "1.1.10.8" }
zero-allocation-hashing = { module = "net.openhft:zero-allocation-hashing", version = "0.16" }
zstd = { module = "com.github.luben:zstd-jni", version = "1.5.7-5" }
